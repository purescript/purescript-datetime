package:
  name: datetime
  description: Date and time types and functions.
  build:
    strict: true
    pedanticPackages: true
  publish:
    version: 6.1.1
    license: BSD-3-Clause
    location:
      githubOwner: purescript
      githubRepo: purescript-datetime
  dependencies:
    - bifunctors: ">=6.0.0 <7.0.0"
    - control: ">=6.0.0 <7.0.0"
    - either: ">=6.0.0 <7.0.0"
    - enums: ">=6.0.0 <7.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - functions: ">=6.0.0 <7.0.0"
    - gen: ">=4.0.0 <5.0.0"
    - integers: ">=6.0.0 <7.0.0"
    - lists: ">=7.0.0 <8.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - newtype: ">=5.0.0 <6.0.0"
    - numbers: ">=9.0.0 <10.0.0"
    - ordered-collections: ">=3.0.0 <4.0.0"
    - partial: ">=4.0.0 <5.0.0"
    - prelude: ">=6.0.0 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
  test:
    main: Test.Main
    strict: true
    pedanticPackages: true
    dependencies:
      - arrays: ">=7.0.0 <8.0.0"
      - assert: ">=6.0.0 <7.0.0"
      - console: ">=6.0.0 <7.0.0"
      - effect: ">=4.0.0 <5.0.0"
workspace: {}
